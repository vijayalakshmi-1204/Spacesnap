<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SpaceSnap - NASA Picture Explorer</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1026;
      color: white;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 35px 20px 20px;
    }

    .header h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .header p {
      color: #c7c9dd;
      font-size: 16px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: 20px auto 50px;
    }

    .card {
      background: #171d3b;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .date {
      text-align: center;
      color: #9fa8ff;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .title {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .space-image {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin-bottom: 20px;
    }

    .video {
      width: 100%;
      height: 500px;
      border: none;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .explanation {
      color: #d9dbeb;
      line-height: 1.7;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .button-area {
      text-align: center;
    }

    button {
      border: none;
      background: #5964ff;
      color: white;
      padding: 13px 25px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #747dff;
      transform: translateY(-2px);
    }

    button:disabled {
      background: #555b7a;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      text-align: center;
      padding: 50px;
      font-size: 20px;
    }

    .error {
      background: #401d28;
      color: #ffb8c5;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .footer {
      text-align: center;
      color: #8589a5;
      padding: 20px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 30px;
      }

      .title {
        font-size: 22px;
      }

      .card {
        padding: 18px;
      }

      .video {
        height: 300px;
      }
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    function App() {

      const [data, setData] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState("");

      // NASA provides DEMO_KEY for free API access
      const API_KEY = "DEMO_KEY";

      const getPicture = async () => {

        setLoading(true);
        setError("");

        try {

          const response = await fetch(
            `https://api.nasa.gov/planetary/apod?api_key=${API_KEY}&thumbs=true`
          );

          if (!response.ok) {
            throw new Error("Unable to get data from NASA API");
          }

          const result = await response.json();

          setData(result);

        } catch (err) {

          setError("Something went wrong. Please try again.");

        } finally {

          setLoading(false);

        }
      };

      React.useEffect(() => {
        getPicture();
      }, []);

      return (
        <div>

          <div className="header">

            <h1>🚀 SpaceSnap</h1>

            <p>
              Explore the universe with NASA's Astronomy Picture of the Day
            </p>

          </div>


          <div className="container">

            {loading && (
              <div className="card loading">
                🌌 Loading space data...
              </div>
            )}


            {error && (
              <div className="card error">
                ❌ {error}
              </div>
            )}


            {data && !loading && (

              <div className="card">

                <div className="date">
                  📅 {data.date}
                </div>

                <h2 className="title">
                  {data.title}
                </h2>


                {data.media_type === "image" ? (

                  <img
                    src={data.hdurl || data.url}
                    alt={data.title}
                    className="space-image"
                  />

                ) : (

                  <iframe
                    src={data.url}
                    title={data.title}
                    className="video"
                    allowFullScreen
                  ></iframe>

                )}


                <p className="explanation">
                  {data.explanation}
                </p>


                <div className="button-area">

                  <button onClick={getPicture} disabled={loading}>
                    🔄 Load Another Picture
                  </button>

                </div>

              </div>

            )}

          </div>


          <div className="footer">

            <p>
              🌍 Data provided by NASA Astronomy Picture of the Day API
            </p>

            <p>
              SpaceSnap © 2026
            </p>

          </div>

        </div>
      );
    }


    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<App />);

  </script>

</body>
</html>
